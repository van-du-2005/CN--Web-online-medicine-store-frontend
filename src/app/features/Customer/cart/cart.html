<div class="min-h-screen bg-blue-50 p-6">
  <div class="max-w-6xl mx-auto grid grid-cols-12 gap-6">
    
    <div class="col-span-12 lg:col-span-8 bg-white rounded-lg shadow-sm p-4">
      <div class="flex items-center justify-between pb-4 border-b border-gray-100">
        <label class="flex items-center gap-2 cursor-pointer font-medium">
          <input type="checkbox" class="w-4 h-4 text-blue-600"> Sản phẩm
        </label>
        <button class="text-blue-600 hover:text-blue-800">Xóa tất cả</button>
      </div>

      <div *ngFor="let item of cartItems" class="flex items-center gap-4 py-4 border-b border-gray-100">
        <input type="checkbox" class="w-4 h-4">
        <img [src]="item.hinhAnh" class="w-16 h-16 object-cover rounded-md">
        <div class="flex-1">
          <p class="font-medium text-gray-800">{{ item.tenThuoc }}</p>
          <p class="text-sm text-gray-500">Phân loại: {{ item.phanLoai }}</p>
        </div>
        <div class="font-bold text-blue-600 w-24 text-right">
          {{ item.donGia | number:'1.0-0' }}đ
        </div>
        <div class="flex items-center border border-gray-300 rounded-md overflow-hidden">
          <button (click)="decrease(item)" class="px-2 py-1 bg-gray-50 hover:bg-gray-100">-</button>
          <input type="text" [(ngModel)]="item.soLuong" class="w-10 text-center text-sm outline-none">
          <button (click)="increase(item)" class="px-2 py-1 bg-gray-50 hover:bg-gray-100">+</button>
        </div>
        <button (click)="removeItem(item.id)" class="text-gray-400 hover:text-red-500">
          <i class="fa fa-trash"></i> </button>
      </div>
    </div>

    <div class="col-span-12 lg:col-span-4">
      <div class="bg-white rounded-lg shadow-sm p-5 sticky top-4">
        <h2 class="text-lg font-bold mb-4">Tổng tiền</h2>
        
        <div class="flex items-center justify-between mb-4 p-3 bg-gray-50 rounded-md cursor-pointer border border-dashed border-gray-300">
          <span class="text-gray-600 text-sm">🎟 Khuyến mãi</span>
          <span class="text-blue-600 font-medium text-sm">Chọn mã</span>
        </div>

        <div class="space-y-3 text-sm">
          <div class="flex justify-between text-gray-600">
            <span>Tạm tính</span>
            <span>{{ tamTinh | number:'1.0-0' }}đ</span>
          </div>
          <div class="flex justify-between text-gray-600">
            <span>Giảm giá ưu đãi</span>
            <span>0đ</span>
          </div>
          <div class="flex justify-between text-gray-600">
            <span>Giảm giá sản phẩm</span>
            <span>0đ</span>
          </div>
          <div class="pt-3 border-t border-gray-100 font-bold text-lg flex justify-between">
            <span>Tổng tiền</span>
            <span class="text-blue-600">{{ tamTinh | number:'1.0-0' }}đ</span>
          </div>
        </div>

        <button class="w-full mt-6 py-3 bg-blue-600 text-white rounded-lg font-bold hover:bg-blue-700 transition">
          Mua hàng
        </button>
      </div>
    </div>

  </div>
</div>
