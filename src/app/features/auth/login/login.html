<div class="text-center mb-6">
  <div
    class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl"
  >
    <i class="fa-solid fa-user"></i>
  </div>
  <h2 class="text-2xl font-bold text-slate-800 mb-1">Chào mừng trở lại!</h2>
  <p class="text-sm text-slate-500">Đăng nhập để mua sắm và quản lý tài khoản</p>
</div>

<div class="flex border-b-2 border-slate-100 mb-6">
  <a
    routerLink="/auth/login"
    class="flex-1 text-center py-3 border-b-2 border-blue-600 text-blue-600 font-semibold cursor-pointer transition-all text-decoration-none"
  >
    <i class="fa-solid fa-right-to-bracket"></i> Đăng nhập
  </a>
  <a
    routerLink="/auth/register"
    class="flex-1 text-center py-3 text-slate-400 hover:text-slate-600 cursor-pointer transition-all border-b-2 border-transparent text-decoration-none"
  >
    <i class="fa-solid fa-user-plus"></i> Đăng ký
  </a>
</div>

<div
  *ngIf="errorMessage"
  class="bg-red-50 text-red-600 p-3 rounded-lg text-sm flex items-center gap-2 mb-4 animate-fade-in"
>
  <i class="fa-solid fa-circle-exclamation"></i>
  <span class="font-medium">{{ errorMessage }}</span>
</div>

<form class="space-y-4" (ngSubmit)="onSubmit()">
  <div>
    <label class="block text-sm font-semibold text-slate-700 mb-1.5"
      >Tên đăng nhập <span class="text-red-500">*</span></label
    >
    <div class="relative flex items-center">
      <i class="fa-solid fa-user absolute left-4 text-slate-400"></i>
      <input
        type="text"
        [(ngModel)]="formData.tenDangNhap"
        name="tenDangNhap"
        class="w-full pl-11 pr-4 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-sm"
        placeholder="Nhập tên đăng nhập"
        autocomplete="username"
      />
    </div>
  </div>

  <div>
    <label class="block text-sm font-semibold text-slate-700 mb-1.5"
      >Mật khẩu <span class="text-red-500">*</span></label
    >
    <div class="relative flex items-center">
      <i class="fa-solid fa-lock absolute left-4 text-slate-400"></i>
      <input
        [type]="showPassword ? 'text' : 'password'"
        [(ngModel)]="formData.matKhau"
        name="matKhau"
        class="w-full pl-11 pr-12 py-3 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all text-sm"
        placeholder="Nhập mật khẩu"
        autocomplete="current-password"
      />
      <button
        type="button"
        (click)="togglePassword()"
        class="absolute right-3 p-1.5 text-slate-400 hover:text-slate-600 cursor-pointer transition-colors border-none bg-transparent"
      >
        <i class="fa-regular" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
      </button>
    </div>
  </div>

  <div class="flex items-center justify-between text-sm">
    <label class="flex items-center gap-2 cursor-pointer group">
      <input
        type="checkbox"
        class="rounded border-slate-300 text-blue-600 shadow-sm focus:ring-blue-500 cursor-pointer"
      />
      <span class="text-slate-600 group-hover:text-slate-800 transition-colors"
        >Ghi nhớ đăng nhập</span
      >
    </label>
    <a
      href="#"
      class="text-blue-600 hover:text-blue-700 hover:underline cursor-pointer transition-all text-decoration-none"
      >Quên mật khẩu?</a
    >
  </div>

  <button
    type="submit"
    [disabled]="isLoading"
    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition-all duration-200 active:scale-[0.98] cursor-pointer shadow-md shadow-blue-500/20 flex justify-center items-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed disabled:transform-none"
  >
    <i *ngIf="isLoading" class="fa-solid fa-spinner fa-spin"></i>
    <i *ngIf="!isLoading" class="fa-solid fa-right-to-bracket"></i>
    <span>{{ isLoading ? 'Đang đăng nhập...' : 'Đăng nhập' }}</span>
  </button>
</form>

<div class="flex items-center gap-3 my-6">
  <div class="flex-1 h-px bg-slate-200"></div>
  <span class="text-sm text-slate-400">hoặc</span>
  <div class="flex-1 h-px bg-slate-200"></div>
</div>

<div id="googleBtnContainer" class="flex justify-center w-full"></div>

<p class="text-center text-sm text-slate-600 mt-6">
  Chưa có tài khoản?
  <a
    routerLink="/auth/register"
    class="text-blue-600 font-semibold hover:underline cursor-pointer text-decoration-none"
    >Đăng ký ngay</a
  >
</p>
