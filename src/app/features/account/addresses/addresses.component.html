<div class="bg-white rounded-xl shadow-sm border border-slate-100 p-6 relative min-h-[400px]">
  <div
    *ngIf="isLoading"
    class="absolute inset-0 bg-white/80 rounded-xl flex items-center justify-center z-20"
  >
    <i class="fa-solid fa-spinner fa-spin text-blue-600 text-3xl"></i>
  </div>

  <div
    class="flex flex-wrap justify-between items-center mb-6 gap-4 border-b border-slate-100 pb-4"
  >
    <h2 class="text-xl font-bold text-slate-800 flex items-center gap-2 m-0">
      <i class="fa-solid fa-location-dot text-blue-600"></i> Quản lý địa chỉ
    </h2>
    <button
      (click)="toggleAddForm()"
      class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium py-2 px-4 rounded-lg transition-colors cursor-pointer shadow-sm flex items-center gap-2 outline-none border-none"
    >
      <i class="fa-solid fa-plus"></i> Thêm địa chỉ
    </button>
  </div>

  <div
    *ngIf="successMessage"
    class="bg-emerald-50 text-emerald-700 p-3 rounded-lg mb-4 text-sm animate-fade-in"
  >
    <i class="fa-solid fa-circle-check mr-1"></i> {{ successMessage }}
  </div>
  <div
    *ngIf="errorMessage"
    class="bg-red-50 text-red-600 p-3 rounded-lg mb-4 text-sm animate-fade-in"
  >
    <i class="fa-solid fa-triangle-exclamation mr-1"></i> {{ errorMessage }}
  </div>

  <div
    *ngIf="showAddForm"
    class="bg-slate-50 border border-slate-200 rounded-xl p-5 mb-6 animate-fade-in"
  >
    <div class="font-bold text-slate-800 mb-4">
      <i class="fa-solid fa-plus text-blue-600 mr-2"></i>Thêm địa chỉ mới
    </div>
    <form (ngSubmit)="saveAddress()" class="space-y-4">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1"
            >Họ tên người nhận <span class="text-red-500">*</span></label
          >
          <input
            type="text"
            [(ngModel)]="newAddress.hoTenNguoiNhan"
            name="hoTenNguoiNhan"
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none"
          />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1"
            >Số điện thoại <span class="text-red-500">*</span></label
          >
          <input
            type="tel"
            [(ngModel)]="newAddress.sdtNguoiNhan"
            name="sdtNguoiNhan"
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none"
          />
        </div>
        <div class="sm:col-span-2">
          <label class="block text-sm font-medium text-slate-700 mb-1"
            >Địa chỉ giao hàng <span class="text-red-500">*</span></label
          >
          <input
            type="text"
            [(ngModel)]="newAddress.diaChi"
            name="diaChi"
            placeholder="Số nhà, đường, phường/xã..."
            class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 outline-none"
          />
        </div>
      </div>
      <label class="flex items-center gap-2 mt-2 cursor-pointer w-max">
        <input
          type="checkbox"
          [(ngModel)]="newAddress.laMacDinh"
          name="laMacDinh"
          class="w-4 h-4 text-blue-600 border-slate-300 rounded cursor-pointer"
        />
        <span class="text-sm text-slate-700 font-medium">Đặt làm địa chỉ mặc định</span>
      </label>
      <div class="flex gap-3 pt-2">
        <button
          type="button"
          (click)="toggleAddForm()"
          [disabled]="isSaving"
          class="px-5 py-2 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-100 font-medium text-sm transition-colors cursor-pointer disabled:opacity-60"
        >
          Hủy
        </button>
        <button
          type="submit"
          [disabled]="isSaving"
          class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-5 rounded-lg transition-colors cursor-pointer shadow-sm text-sm flex items-center gap-2 disabled:opacity-60 disabled:cursor-not-allowed"
        >
          <i *ngIf="isSaving" class="fa-solid fa-spinner fa-spin"></i>
          <i *ngIf="!isSaving" class="fa-solid fa-floppy-disk"></i> Lưu địa chỉ
        </button>
      </div>
    </form>
  </div>

  <div *ngIf="!isLoading && addresses.length === 0" class="text-center py-12">
    <div class="text-5xl mb-4">📍</div>
    <h3 class="text-lg font-bold text-slate-800 mb-2">Chưa có địa chỉ nào</h3>
    <p class="text-slate-500">Thêm địa chỉ để thanh toán đơn hàng nhanh chóng hơn</p>
  </div>

  <div *ngIf="!isLoading && addresses.length > 0" class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div
      *ngFor="let addr of addresses"
      class="border rounded-xl p-5 relative transition-all"
      [ngClass]="addr.laMacDinh ? 'border-blue-500 bg-blue-50/30' : 'border-slate-200'"
    >
      <span
        *ngIf="addr.laMacDinh"
        class="absolute top-4 right-4 bg-blue-100 text-blue-700 text-xs font-bold px-2.5 py-1 rounded-full"
        >Mặc định</span
      >

      <div class="font-bold text-slate-800 mb-1 pr-16">{{ addr.hoTenNguoiNhan }}</div>
      <div class="text-sm text-slate-600 mb-2">
        <i class="fa-solid fa-phone text-xs mr-1 opacity-70"></i>{{ addr.sdtNguoiNhan }}
      </div>
      <div class="text-sm text-slate-700 mb-4 line-clamp-2 min-h-[40px]">{{ addr.diaChi }}</div>

      <div class="flex gap-2">
        <button
          *ngIf="!addr.laMacDinh"
          (click)="setDefault(addr.maDiaChi)"
          class="flex-1 py-1.5 px-3 border border-slate-300 text-slate-700 rounded text-sm hover:bg-slate-50 transition-colors cursor-pointer font-medium"
        >
          Thiết lập mặc định
        </button>
        <button
          (click)="deleteAddress(addr.maDiaChi)"
          class="w-9 h-auto flex items-center justify-center border border-red-200 text-red-500 rounded hover:bg-red-50 transition-colors cursor-pointer"
        >
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>
    </div>
  </div>
</div>
