<!-- Widget Button -->
<button
  (click)="toggle()"
  class="fixed bottom-6 right-6 z-50 w-12 h-12 rounded-full bg-blue-600 text-white shadow-lg hover:bg-blue-700 hover:scale-110 transition-all flex items-center justify-center overflow-hidden"
  title="Tư vấn AI"
>
  <img *ngIf="!isOpen()" src="images/logo/trolyAI.png" alt="Chat" class="w-full h-full object-cover rounded-full">
  <svg *ngIf="isOpen()" class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
  </svg>
</button>

<!-- Chat Window -->
<div
  *ngIf="isOpen()"
  class="fixed bottom-24 right-6 z-50 w-80 sm:w-96 bg-white rounded-2xl shadow-2xl border border-gray-200 flex flex-col overflow-hidden"
  style="height: 480px;"
>
  <!-- Header -->
  <div class="bg-blue-600 px-4 py-3 flex items-center gap-3 flex-shrink-0">
    <img src="images/logo/trolyAI.png" alt="Trợ lý AI" class="w-9 h-9 rounded-full object-cover flex-shrink-0">
    <div>
      <p class="text-white font-semibold text-sm">Trợ lý AI Sống Khỏe</p>
      <p class="text-blue-100 text-xs">Tư vấn thuốc & sức khỏe</p>
    </div>
  </div>

  <!-- Messages -->
  <div #messageList class="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
    <div *ngFor="let msg of messages" class="flex" [class.justify-end]="msg.role === 'user'">

      <!-- Bot message -->
      <div *ngIf="msg.role === 'bot'"
        class="flex items-end gap-2 max-w-[85%]">
        <img src="images/logo/trolyAI.png" alt="Bot" class="w-7 h-7 rounded-full object-cover flex-shrink-0">
        <div class="bg-white border border-gray-200 rounded-2xl rounded-bl-sm px-3 py-2 text-sm text-gray-700 shadow-sm">
          <!-- Loading dots -->
          <div *ngIf="msg.loading" class="flex gap-1 items-center py-1">
            <span class="w-2 h-2 bg-blue-400 rounded-full animate-bounce" style="animation-delay:0ms"></span>
            <span class="w-2 h-2 bg-blue-400 rounded-full animate-bounce" style="animation-delay:150ms"></span>
            <span class="w-2 h-2 bg-blue-400 rounded-full animate-bounce" style="animation-delay:300ms"></span>
          </div>
          <span *ngIf="!msg.loading" [innerHTML]="renderMarkdown(msg.text)"></span>
        </div>
      </div>

      <!-- User message -->
      <div *ngIf="msg.role === 'user'"
        class="bg-blue-600 text-white rounded-2xl rounded-br-sm px-3 py-2 text-sm max-w-[85%] shadow-sm">
        {{ msg.text }}
      </div>

    </div>
  </div>

  <!-- Input -->
  <div class="flex-shrink-0 border-t border-gray-200 bg-white px-3 py-3 flex gap-2 items-end">
    <textarea
      [(ngModel)]="inputText"
      (keydown)="onEnter($event)"
      placeholder="Nhập triệu chứng hoặc tên thuốc..."
      rows="1"
      class="flex-1 resize-none rounded-xl border border-gray-300 px-3 py-2 text-sm outline-none focus:border-blue-500 transition-colors"
      style="max-height: 80px; overflow-y: auto;"
    ></textarea>
    <button
      (click)="send()"
      [disabled]="!inputText.trim()"
      class="w-9 h-9 bg-blue-600 text-white rounded-xl flex items-center justify-center hover:bg-blue-700 disabled:opacity-40 disabled:cursor-not-allowed transition-all flex-shrink-0"
    >
      <svg class="w-4 h-4 rotate-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
      </svg>
    </button>
  </div>
</div>
