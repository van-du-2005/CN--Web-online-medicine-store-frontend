<!-- Top Header Section -->
<div class="bg-gradient-to-r from-blue-500 to-blue-600 shadow-md">
  <!-- Main Header Container -->
  <div class="max-w-7xl mx-auto px-4 py-3">
    <div class="flex items-center justify-between gap-4">
      <!-- Logo -->
      <div
        class="flex items-center gap-2 flex-shrink-0 cursor-pointer hover:opacity-90 transition-opacity"
        (click)="navigateToHome()"
      >
        <div class="bg-white rounded-full w-12 h-12 flex items-center justify-center">
          <span class="text-blue-600 font-bold text-sm">🏥</span>
        </div>
        <div class="text-white">
          <div class="font-bold text-sm">NHÀ THUỐC</div>
          <div class="font-bold text-lg">Sống Khỏe</div>
        </div>
      </div>

      <!-- Search Bar -->
      <div class="flex-grow max-w-md">
        <form (ngSubmit)="onSearch()" class="relative">
          <div class="flex items-center bg-white rounded-full shadow-lg">
            <input
              type="text"
              [(ngModel)]="searchQuery"
              name="search"
              placeholder="Tìm kiếm"
              class="w-full px-5 py-3 rounded-full outline-none text-gray-700 placeholder-gray-400"
            />
            <button type="submit" class="px-4 pr-6 text-gray-400 hover:text-blue-600 transition">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
                ></path>
              </svg>
            </button>
          </div>
        </form>
      </div>

      <!-- Right Actions -->
      <div class="flex items-center gap-3 flex-shrink-0">
        <!-- Cart Button -->
        <button
          (click)="navigateToCart()"
          class="bg-white text-blue-600 px-4 py-2 rounded-lg font-semibold hover:bg-gray-100 transition flex items-center gap-2 whitespace-nowrap"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"
            ></path>
          </svg>
          Giỏ hàng
        </button>

        <!-- Login Button -->
        <ng-container *ngIf="isLoggedIn(); else loginBtn">
          <button
            (click)="navigateToAccount()"
            class="bg-blue-800 text-white border border-blue-400 px-4 py-2 rounded-lg font-semibold hover:bg-blue-900 transition flex items-center gap-2 whitespace-nowrap shadow-sm"
          >
            <svg
              class="w-5 h-5 text-blue-200"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
              ></path>
            </svg>
            Tài khoản
          </button>
        </ng-container>
        <ng-template #loginBtn>
          <button
            (click)="navigateToLogin()"
            class="bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-800 transition whitespace-nowrap"
          >
            Đăng nhập
          </button>
        </ng-template>
      </div>
    </div>
  </div>

  <!-- Navigation Menu -->
  <div class="border-t border-blue-400 bg-white">
    <div class="max-w-7xl mx-auto px-4">
      <div class="flex items-center justify-start gap-8 py-3">
        <div
          *ngFor="let item of menuItems"
          class="text-black font-semibold cursor-pointer hover:text-blue-600 transition whitespace-nowrap text-sm flex items-center gap-1 group"
        >
          <span>{{ item.label }}</span>
          <span class="text-xs group-hover:translate-y-0.5 transition">{{ item.icon }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
