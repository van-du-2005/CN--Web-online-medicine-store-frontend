<div class="flex h-screen bg-slate-50 overflow-hidden font-sans text-slate-800 relative">
  <div
    *ngIf="isLoading"
    class="absolute inset-0 bg-white/80 z-50 flex items-center justify-center backdrop-blur-sm"
  >
    <i class="fa-solid fa-spinner fa-spin text-4xl text-blue-600"></i>
  </div>

  <aside
    class="w-64 bg-white border-r border-slate-200 flex flex-col flex-shrink-0 transition-all duration-300 hidden md:flex"
  >
    <div class="h-[70px] flex items-center px-6 border-b border-slate-200">
      <span class="text-xl font-bold text-blue-700 flex items-center gap-2">
        <i class="fa-solid fa-notes-medical"></i> Admin Panel
      </span>
    </div>

    <nav class="flex-1 overflow-y-auto py-4 flex flex-col gap-1 px-3">
      <a
        *ngFor="let item of menuItems"
        [routerLink]="item.path"
        routerLinkActive="bg-blue-50 text-blue-700 border-l-4 border-blue-600 font-semibold"
        class="flex items-center gap-3 px-4 py-3 rounded-lg text-slate-600 hover:bg-slate-50 hover:text-blue-600 transition-colors cursor-pointer outline-none border-l-4 border-transparent text-decoration-none"
      >
        <i class="fa-solid {{ item.icon }} w-5 text-center"></i> {{ item.label }}
      </a>
    </nav>

    <div class="p-4 border-t border-slate-200">
      <button
        (click)="logout()"
        class="w-full flex items-center justify-center gap-2 px-4 py-2.5 bg-red-50 text-red-600 font-medium rounded-lg hover:bg-red-100 transition-colors cursor-pointer outline-none border-none"
      >
        <i class="fa-solid fa-right-from-bracket"></i> Đăng xuất
      </button>
    </div>
  </aside>

  <div class="flex-1 flex flex-col overflow-hidden">
    <header
      class="h-[70px] bg-white border-b border-slate-200 flex items-center justify-between px-6 shadow-sm z-10 flex-shrink-0"
    >
      <div class="flex items-center gap-4">
        <button
          class="md:hidden text-slate-500 hover:text-blue-600 cursor-pointer outline-none border-none bg-transparent text-xl"
        >
          <i class="fa-solid fa-bars"></i>
        </button>
        <h1 class="text-lg md:text-xl font-bold text-slate-800 m-0">{{ pageTitle }}</h1>
      </div>

      <div class="flex items-center gap-5">
        <div class="text-slate-400 hover:text-blue-600 cursor-pointer transition-colors text-xl">
          <i class="fa-regular fa-bell"></i>
        </div>

        <div
          class="flex items-center gap-3 cursor-pointer p-1.5 rounded-lg hover:bg-slate-50 transition-colors"
        >
          <div
            class="w-10 h-10 rounded-full bg-amber-100 text-amber-700 font-bold flex items-center justify-center text-lg"
          >
            {{ avatarChar }}
          </div>
          <div class="flex flex-col leading-tight hidden sm:flex">
            <span class="font-semibold text-slate-800 text-sm">{{ adminName }}</span>
            <span class="text-xs text-slate-500">{{ adminRole }}</span>
          </div>
          <i class="fa-solid fa-chevron-down text-xs text-slate-400 ml-1 hidden sm:block"></i>
        </div>
      </div>
    </header>

    <main class="flex-1 overflow-x-hidden overflow-y-auto bg-slate-50 p-6 relative">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
